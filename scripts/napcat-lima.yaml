# Isolated ARM64 QQ runtime. No host folders, container engine, or local AI model.
vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
disk: 12GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260321/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:1ea801e659d2f5035ac294e0faab0aac9b6ba66753df933ba5c7beab0c689bd0
mounts: []
containerd:
  system: false
  user: false
user:
  name: azusa
  home: /home/azusa
  uid: 1000
portForwards:
  - guestPort: 6099
    hostPort: 6200
    hostIP: 127.0.0.1
  - guestIP: 0.0.0.0
    proto: any
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y --no-install-recommends xvfb xauth ca-certificates curl python3 libnss3 libgbm1 libasound2t64 libgssapi-krb5-2 libxdamage1 libxcomposite1 libxfixes3 libxrender1 libx11-6 libxext6 libxkbcommon0 libcairo2 libcairo-gobject2 libgdk-pixbuf-2.0-0 libpangoft2-1.0-0 libpango-1.0-0 libglib2.0-0t64 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libxcursor1 libwayland-cursor0 libwayland-egl1 libxinerama1 libepoxy0 libgtk-3-0t64
      install -d -o azusa -g azusa -m 700 /opt/azusa /opt/azusa/napcat /opt/azusa/qq-data
