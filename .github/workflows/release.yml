name: Native packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
      - name: Install pinned native core and AstrBot
        run: uv run --no-project --python 3.12 scripts/install_release.py --no-open
      - name: Native feature and permission tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest -q tests/test_native_host.py tests/test_manual_idle.py tests/test_group_idle.py tests/test_reply_contract.py tests/test_request_context.py
          "$PY" scripts/smoke_release.py
      - name: Assemble public package
        shell: bash
        run: |
          mkdir -p dist
          curl --fail --location https://raw.githubusercontent.com/astral-sh/uv/0.11.8/LICENSE-MIT -o dist/uv-LICENSE-MIT
          curl --fail --location https://raw.githubusercontent.com/astral-sh/uv/0.11.8/LICENSE-APACHE -o dist/uv-LICENSE-APACHE
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/build_release.py --platform '${{ matrix.platform }}' --uv "$(which uv)"
      - uses: actions/upload-artifact@v4
        with:
          name: xzbot-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          三平台原生启动包（Release Candidate）。下载与你系统对应的 ZIP，解压后运行 Start-XZBot；首次启动联网安装 Python 与固定依赖。

          新增：群聊参与 → 冷场发言 → 立即发起一次聊天；跳过自动等待与评分，保留发送权限与回执。

          Windows 无需 WSL；Windows/Linux 连接外部原生 NapCat。Mac 使用已有 Lima 路径。程序不包含个人 key、角色、聊天或 QQ 会话。

          三系统原生安装、核心与桥接启动检查通过才发布；CI 不登录 QQ，目标系统的真实 QQ/语音收发仍需现场验收。解压后请阅读 READ-ME-FIRST.md。SHA256 校验文件与 ZIP 同时提供。
          NOTES
          gh release create "$TAG" release-assets/* --title "XZBot $TAG — Windows / macOS / Linux" --notes-file release-notes.md --prerelease --verify-tag
