name: Native packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
      - name: Install pinned native core and AstrBot
        run: uv run --no-project --python 3.12 scripts/install_release.py --no-open
      - name: Native feature and permission tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest -q tests/test_native_host.py tests/test_starter_profiles.py tests/test_prompt_defaults.py tests/test_manual_idle.py tests/test_group_idle.py tests/test_reply_contract.py tests/test_request_context.py
      - name: Assemble public package
        shell: bash
        run: |
          mkdir -p dist
          curl --fail --location https://raw.githubusercontent.com/astral-sh/uv/0.11.8/LICENSE-MIT -o dist/uv-LICENSE-MIT
          curl --fail --location https://raw.githubusercontent.com/astral-sh/uv/0.11.8/LICENSE-APACHE -o dist/uv-LICENSE-APACHE
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/build_release.py --platform '${{ matrix.platform }}'
      - name: Verify exact release ZIP in a fresh Unicode directory
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/verify_release_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: xzbot-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" release-assets/* --title "XZBot $TAG — Windows / macOS / Linux" --notes-file docs/release-notes.md --prerelease --verify-tag
