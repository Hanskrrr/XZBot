name: Sync Gitee release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      GITEE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签；留空同步最近发布的版本（包括候选版）'
        type: string
        default: ''
      dry_run:
        description: '只下载并校验 GitHub 附件，不写入 Gitee'
        type: boolean
        default: false
  release:
    types: [published, edited]
permissions:
  contents: read
# Serialize manual backfills and automatic runs, including a blank/latest tag.
concurrency:
  group: xzbot-gitee-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check publishing credential
        id: config
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ -n "$GITEE_TOKEN" ] || [ "$DRY_RUN" = true ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '### Gitee 同步尚未启用' >> "$GITHUB_STEP_SUMMARY"
            echo '请添加 Actions 仓库 Secret：GITEE_TOKEN（Gitee 的 projects 权限），然后手动运行本工作流补同步。GitHub 发行版不受影响。' >> "$GITHUB_STEP_SUMMARY"
            echo '::notice::Gitee sync skipped: configure the GITEE_TOKEN repository secret.'
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          version: '0.11.8'
      - name: Verify source packages and mirror release
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        shell: bash
        run: |
          args=(--tag "$TAG")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          uv run --no-project --python 3.12 --with httpx==0.28.1 python scripts/sync_gitee_release.py "${args[@]}"
